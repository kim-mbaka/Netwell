<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Netwells Home Fibre | Affordable Fibre Internet in Kenya</title>
    <meta name="description" content="Netwells Home Fibre delivers fast, reliable and affordable home fibre internet in Kenya. Plans from KES 1,500/month. Get connected today." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0e2150" />
    <meta property="og:title" content="Netwells Home Fibre" />
    <meta property="og:description" content="Fast, reliable and affordable home fibre internet in Kenya. Plans from KES 1,500/month." />
    <meta property="og:image" content="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://netwells.co.ke/" />
    <link rel="canonical" href="https://netwells.co.ke/" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Default: dark.
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.classList.toggle('dark', t === 'dark');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="font-sans">
    <div id="root"></div>
  </body>
</html>

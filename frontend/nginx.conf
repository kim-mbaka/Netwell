# Preserve the original protocol from the host nginx (which terminates TLS).
# Falls back to this server's scheme if the header is absent.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Match the host nginx client_max_body_size for uploads
    client_max_body_size 60M;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compression (text assets only; images are already compressed) ---
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml font/ttf font/otf font/woff font/woff2;

    # Django REST API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Django collected static (admin CSS/JS) — from shared volume
    location /django-static/ {
        alias /usr/share/nginx/django-static/;
        add_header Cache-Control "public, max-age=2592000";
    }

    # User-uploaded media — from shared volume
    location /media/ {
        alias /usr/share/nginx/media/;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Hashed CRA build assets (main.<hash>.js/css) — safe to cache forever
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Non-hashed public images (logo, hero, blog) — cache a month
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
    }
    location /images/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # React SPA — never cache the HTML shell (it points at the hashed assets)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

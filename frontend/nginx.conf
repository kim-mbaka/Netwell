server {
    listen 80;
    server_name _;

    # Allow review/blog images and other uploads through
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    # Django REST API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django collected static (admin CSS/JS) — from shared volume
    location /django-static/ {
        alias /usr/share/nginx/django-static/;
    }

    # User-uploaded media — from shared volume
    location /media/ {
        alias /usr/share/nginx/media/;
    }

    # React single-page app (its own assets live under /static/ on disk)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

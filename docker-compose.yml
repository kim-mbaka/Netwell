services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netwell}
      POSTGRES_USER: ${POSTGRES_USER:-netwell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netwell}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netwell} -d ${POSTGRES_DB:-netwell}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn netwell.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DATABASE_URL: postgres://${POSTGRES_USER:-netwell}:${POSTGRES_PASSWORD:-netwell}@db:5432/${POSTGRES_DB:-netwell}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - static_volume:/usr/share/nginx/django-static:ro
      - media_volume:/usr/share/nginx/media:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume:

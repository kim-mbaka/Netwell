# Production stack for the VPS.
# TLS + domain routing are handled by the HOST nginx + certbot; this stack only
# exposes the app on a private localhost port (see APP_PORT, default 8120).
#
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netwell}
      POSTGRES_USER: ${POSTGRES_USER:-netwell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netwell}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netwell} -d ${POSTGRES_DB:-netwell}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn netwell.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-True}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-True}
      DATABASE_URL: postgres://${POSTGRES_USER:-netwell}:${POSTGRES_PASSWORD:-netwell}@db:5432/${POSTGRES_DB:-netwell}
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    # Bind to localhost only — the host nginx reverse-proxies to this port.
    ports:
      - "127.0.0.1:${APP_PORT:-8120}:80"
    volumes:
      - static_volume:/usr/share/nginx/django-static:ro
      - media_volume:/usr/share/nginx/media:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  static_volume:
  media_volume:
